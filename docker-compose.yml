version: "3.8"

services:
  app:
    build: .
    ports:
      - "8501:8501"
      - "8000:8000" # metrics endpoint
    volumes:
      - ./:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
version: '3.8'
services:
  web:
    build: .
    image: capstone-poster:latest
    ports:
      - "8501:8501"
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/app
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
